<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乗務日報</title>
<style>
    body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',Meiryo,'Noto Sans CJK JP',sans-serif;
        background:#f0f4f8;color:#333;margin:0;padding:0}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px}
    .toolbar button{background:#2c3e50;color:#fff;padding:10px 24px;border:none;border-radius:4px;cursor:pointer;font-size:1em}
    .toolbar .back{background:#95a5a6}
    #fit{overflow-x:hidden}
    .container{width:1100px;margin:0 auto 20px;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);box-sizing:border-box;zoom:var(--z,1)}
    table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:.85em}
    th,td{border:1px solid #bdc3c7;padding:4px;text-align:center;vertical-align:middle}
    th{background:#ecf0f1;color:#2c3e50}
    input[type=text]{width:90%;padding:4px;border:1px solid #ccc;border-radius:4px}
    .nippo-header-flex{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;background:#f8f9fa;padding:10px 15px;border-radius:8px;border:1px solid #dee2e6}
    .nippo-info-row{display:flex;gap:15px;align-items:flex-end}
    .nippo-info-item label{font-size:.9em;color:#555;display:block;margin-bottom:2px}
    .readonly-val{font-size:1.1em;font-weight:bold;color:#2c3e50;line-height:28px;padding-bottom:2px}
    .stamp-area{display:flex;gap:10px}
    .stamp-box{width:70px;height:70px;border:1px solid #333;background:#fff;display:flex;flex-direction:column}
    .stamp-title{font-size:.65em;text-align:center;border-bottom:1px solid #333;padding:2px 0;line-height:1.1}
    .stamp-mark{flex:1;display:flex;align-items:center;justify-content:center;color:#e0e0e0;font-size:1.8em}
    .nippo-body-flex{display:flex;gap:20px;align-items:flex-start}
    .inspection-section{width:280px;flex-shrink:0}
    .inspection-title{font-weight:bold;margin-bottom:8px;font-size:1.05em;color:#2c3e50}
    .inspection-table td{text-align:left;padding:4px 8px}
    .inspection-table td+td{text-align:center}
    .box{border:1px solid #7f8c8d;height:35px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:bold}
    .cir{display:inline-block;border:1.5px solid #000;border-radius:50%;padding:0 .35em;line-height:1.5}
    .route{display:flex;align-items:center;gap:10px;text-align:left;padding-right:95px}
    .route .sel{white-space:nowrap;flex-shrink:0}
    .h{font-weight:bold;margin-bottom:5px;font-size:1em;color:#2c3e50}

    @media print{
        @page{size:A4 landscape;margin:10mm}
        body{background:#fff}
        .toolbar{display:none!important}
        .container{width:100%;zoom:1;box-shadow:none;margin:0;padding:0;border-radius:0}
        table{font-size:.75em}
        input{border:none!important;background:transparent;outline:none}
    }
</style>
</head>
<body>
<div class="toolbar"><button class="back" onclick="location.href='index.html'">戻る</button><button onclick="window.print()">印刷する</button></div>
<div id="fit"><div class="container" id="sheet"></div></div>

<script>
"use strict";
// 運転日報アプリ(index.html)が端末に保存した今回の記録を読み込んで、乗務日報に転記する
let S = {rows:[]};
try{ S = JSON.parse(localStorage.getItem("unten-nippo-v1")) || S; }catch(e){}
const rows = S.rows || [];
const esc = v => String(v==null ? "" : v).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = t => t ? String(t).slice(11,16) : "";
const num = v => /^\d+$/.test(String(v)) ? Number(v) : null;
const cir = t => `<span class="cir">${t}</span>`;
const WD = ["日","月","火","水","木","金","土"];

const first = k => rows.find(r=>r.kind===k);
const last = k => rows.slice().reverse().find(r=>r.kind===k);
const start = first("業務開始"), kosei = first("乗務開始"), kiko = last("帰庫");

// 日付
let dateStr = "";
const t0 = (start || rows[0] || {}).time;
if(t0){ const d = new Date(t0.slice(0,10)+"T00:00:00");
  dateStr = `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,"0")}月${String(d.getDate()).padStart(2,"0")}日 (${WD[d.getDay()]})`; }

// 走行距離
const o1 = kosei ? num(kosei.odo) : null, o2 = kiko ? num(kiko.odo) : null;
const dist = (o1!==null && o2!==null) ? String(o2-o1) : "";

// 出発→到着の1組ごと。帰庫で終わる組は回送とみなす
const legs = []; let cur = null;
rows.forEach(r=>{
  if(r.kind==="乗務開始" || r.kind==="出発") cur = r;
  else if(r.kind==="回送で到着" || r.kind==="実車で到着" || r.kind==="帰庫"){
    legs.push({dep:cur, arr:r, type: r.kind==="実車で到着" ? "実車" : "回送"}); cur = null;
  }
});
const fuels = rows.filter(r=>r.kind==="給油");

const CHECK = ["エンジン（かかり具合・異音）","ブレーキ（踏みしろ・きき具合）","パーキングブレーキ（ひきしろ）","ワイパー（消耗具合）",
  "ウィンドウォッシャー液","方向指示器","ブレーキオイル","ラジエータ・ファンベルト","エンジンオイル・バッテリー","ライト類",
  "タイヤ（空気圧・消耗・溝）","スペアタイヤ","非常信号用具","車検証"];
const stamp = t => `<div class="stamp-box"><div class="stamp-title">${t}</div><div class="stamp-mark">印</div></div>`;
const NO = t => `<div style="display:flex;justify-content:space-between;align-items:center"><span>${t}</span><span>有・${cir("無")}</span></div>`;

const legRows = Array.from({length:Math.max(5, legs.length)}, (_,i)=>{
  const L = legs[i];
  const kind = L ? `<span class="sel">${L.type==="回送"?cir("回送"):"回送"}・${L.type==="実車"?cir("実車"):"実車"}</span>` : "";
  const route = L ? `<span>${esc((L.dep&&L.dep.addr)||"")} → ${esc(L.arr.addr||"")}</span>` : "";
  return `<tr><td style="height:38px"></td><td>${L&&L.dep?hm(L.dep.time):""}</td>
    <td style="position:relative"><div class="route">${kind}${route}</div><span style="position:absolute;bottom:2px;right:4px;font-size:.7em;color:#333">□　運行指示書と同じ</span></td>
    <td>${L?hm(L.arr.time):""}</td><td></td></tr>`;
}).join("");
const ZEN = ["１","２","３","４","５","６","７","８","９"];
const fuelRows = Array.from({length:Math.max(2, fuels.length)}, (_,i)=>{
  const f = fuels[i];
  return `<tr><th style="height:30px">${ZEN[i]||i+1}回目</th><td>${f?esc(f.odo):""}</td><td>${f?esc(f.fuel):""}</td></tr>`;
}).join("");

document.getElementById("sheet").innerHTML = `
<h2 style="text-align:center;border-bottom:2px solid #2c3e50;padding-bottom:10px;margin-top:0">乗務日報（運転記録）</h2>
<div class="nippo-header-flex"><div class="nippo-info-row">
  <div class="nippo-info-item" style="width:200px"><div style="height:28px;display:flex;align-items:center;justify-content:center;font-size:.9em;font-weight:bold;color:#2c3e50">${esc(dateStr)}</div></div>
  <div class="nippo-info-item" style="width:140px"><label>車両番号</label><div class="readonly-val">${esc(S.vehicle||"")}</div></div>
  <div class="nippo-info-item" style="width:200px"><label>運転者氏名</label><input type="text" value="${esc(S.driver||"")}" style="width:100%;box-sizing:border-box;height:28px"></div>
</div></div>
<div class="nippo-body-flex">
  <div class="inspection-section">
    <div style="margin-bottom:15px"><div class="inspection-title">業務開始時刻</div><div class="box">${hm(start&&start.time)}</div></div>
    <div class="inspection-title">乗務前点検・点呼の実施状況</div>
    <table class="inspection-table" style="font-size:.85em"><tbody>
      ${CHECK.map((t,i)=>`<tr><td>${t}</td>${i===0?'<td style="width:40px">◯</td>':"<td>◯</td>"}</tr>`).join("")}
    </tbody></table>
    <div class="stamp-area" style="margin-top:15px;justify-content:center;gap:20px">${stamp("運行管理者<br>（補助者）")}${stamp("整備管理者<br>（補助者）")}</div>
  </div>
  <div style="flex-grow:1">
    <table style="margin-bottom:15px"><thead><tr>
      <th style="width:12%">出庫時刻</th><th style="width:16%">開始時ODO</th><th style="width:28%">休憩時間・場所</th>
      <th style="width:12%">帰庫時刻</th><th style="width:16%">帰庫時ODO</th><th style="width:16%">乗務中走行距離</th></tr></thead>
      <tbody><tr><td style="height:50px">${hm(kosei&&kosei.time)}</td><td>${esc(kosei?kosei.odo:"")}</td><td></td>
      <td>${hm(kiko&&kiko.time)}</td><td>${esc(kiko?kiko.odo:"")}</td><td>${dist}${dist?" km":""}</td></tr></tbody></table>
    <div class="h">乗客の運送状況</div>
    <table><thead><tr><th style="width:17%">お客様名（または番号）</th><th style="width:9%">乗車時刻</th><th style="width:49%">出発地〜主な経由地〜目的地</th><th style="width:9%">到着時刻</th><th style="width:16%">運賃・料金の総額</th></tr></thead>
      <tbody>${legRows}</tbody></table>
    <div style="display:flex;gap:20px;align-items:stretch;margin-top:15px">
      <div style="width:33%;display:flex;flex-direction:column">
        <div class="h">給油</div>
        <table style="margin-bottom:auto"><tr><td style="width:33%;background:linear-gradient(to top right,transparent 49.5%,#bdc3c7 49.5%,#bdc3c7 50.5%,transparent 50.5%);height:30px"></td><th style="width:33%">走行距離</th><th style="width:33%">給油量</th></tr>${fuelRows}</table>
        <div style="margin-top:10px"><div class="inspection-title">業務終了時刻</div><div class="box">${hm(kiko&&kiko.time)}</div></div>
      </div>
      <div style="width:33%;display:flex;flex-direction:column">
        <div class="h">業務後点呼の状況</div>
        <table style="margin-bottom:10px"><tbody>
          <tr><td style="width:50%;padding:4px 10px;white-space:nowrap">${NO("車両の異常")}</td><td style="width:50%;padding:4px 10px;white-space:nowrap">${NO("交通事故")}</td></tr>
          <tr><td style="padding:4px 10px;white-space:nowrap">${NO("忘れ物等")}</td><td style="padding:4px 10px;white-space:nowrap">${NO("体調の異常")}</td></tr>
        </tbody></table>
        <div style="border:1px solid #bdc3c7;background:#fff;border-radius:4px;padding:4px;box-sizing:border-box;flex-grow:1"><span style="font-size:.85em;font-weight:bold;color:#2c3e50">報告事項（事故・忘れ物等）</span></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:5px">
        <div style="margin-bottom:5px">${stamp("運行管理者<br>（補助者）")}</div>
        <div style="font-size:.7em;color:#333;text-align:center;white-space:nowrap">□　アルコール検知器による検知無し</div>
      </div>
    </div>
  </div>
</div>`;

// 画面幅に合わせて縮小表示(印刷時は等倍)
function fit(){ document.getElementById("sheet").style.setProperty("--z", Math.min(1, document.documentElement.clientWidth/1100)); }
fit(); addEventListener("resize", fit);
</script>
</body>
</html>

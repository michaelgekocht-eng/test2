<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運行指示書</title>
<style>
    body {
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans CJK JP', sans-serif;
        background-color: #f0f4f8;
        color: #333;
        margin: 0;
        padding: 0;
    }
    .toolbar {
        max-width: 1200px;
        margin: 16px auto 0;
        padding: 0 16px;
        display: flex;
        justify-content: flex-end;
    }
    .print-btn {
        background: #2c3e50;
        color: #fff;
        padding: 10px 24px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
    }
    .container {
        max-width: 1200px;
        margin: 12px auto 20px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 15px;
        font-size: 0.85em;
    }
    th, td {
        border: 1px solid #bdc3c7;
        padding: 4px;
        text-align: center;
        vertical-align: middle;
    }
    th {
        background-color: #ecf0f1;
        color: #2c3e50;
    }
    input[type="text"] {
        border: none;
        background: transparent;
        outline: none;
        font-family: inherit;
        font-size: inherit;
        color: inherit;
    }

    .stamp-box {
        width: 70px;
        height: 70px;
        border: 1px solid #333;
        background: white;
        display: flex;
        flex-direction: column;
    }
    .stamp-title {
        font-size: 0.65em;
        text-align: center;
        border-bottom: 1px solid #333;
        padding: 2px 0;
        line-height: 1.1;
    }
    .stamp-mark {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e0e0e0;
        font-size: 1.8em;
    }

    .shijisho-title {
        text-align: center;
        border-bottom: 2px solid #2c3e50;
        padding-bottom: 10px;
        margin-top: 0;
    }
    .top-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 15px;
    }
    .route-row td { height: 40px; }
    .notes-row { display: flex; gap: 15px; }
    .notes-row table { width: 50%; margin-bottom: 0; }
    .notes-row td { height: 100px; vertical-align: top; text-align: left; padding: 8px; }

    @media print {
        @page { size: A4 landscape; margin: 10mm; }
        html, body { background: white; margin: 0; padding: 0; }
        .toolbar { display: none !important; }
        .container {
            box-shadow: none;
            margin: 0;
            padding: 0;
            max-width: 100%;
            width: 100%;
            border-radius: 0;
        }
        table { font-size: 0.75em; }
        .route-row td { height: 36px; }
        .notes-row td { height: 88px; }
        .top-row { margin-bottom: 12px; }
        table { margin-bottom: 12px; }
    }
</style>
</head>
<body>

<div class="toolbar">
    <button class="print-btn" onclick="window.print()">印刷する</button>
</div>

<div class="container">
    <div class="shijisho-page">
        <h2 class="shijisho-title">運行指示書</h2>

        <div class="top-row">
            <div style="width: 45%;">
                <table style="margin-bottom: 0;">
                    <tr>
                        <th style="width: 35%; height: 3em;">乗務員氏名</th>
                        <td style="text-align: left; padding-left: 10px; height: 3em;"><input type="text" id="driver" style="width: 90%; font-size: 1.1em; font-weight: bold;"></td>
                    </tr>
                    <tr>
                        <th style="height: 3em;">車両名 / 車両番号</th>
                        <td id="car-cell" style="text-align: left; padding-left: 10px; font-weight: bold; height: 3em;"><input type="text" id="car" style="width: 90%; font-weight: bold;"></td>
                    </tr>
                </table>
            </div>
            <div style="display: flex; gap: 20px; align-items: flex-end;">
                <div style="font-size: 1.1em; font-weight: bold; text-align: left;">
                    作成日：<input type="text" id="created" style="display: inline-block; width: 190px; text-align: center; border-bottom: 1px solid #333; font-weight: bold;"><br>
                    株式会社　樂涛
                </div>
                <div class="stamp-box"><div class="stamp-title">運行管理者</div><div class="stamp-mark">印</div></div>
            </div>
        </div>

        <table>
            <tr>
                <th style="width: 10%;">運行開始</th>
                <td style="width: 15%; text-align: left; padding: 10px; vertical-align: top;">日時：<br><br>地点：</td>
                <th style="width: 10%;">運行終了</th>
                <td style="width: 15%; text-align: left; padding: 10px; vertical-align: top;">日時：<br><br>地点：</td>

                <th style="width: 10%; padding: 0;">
                    <div style="border-bottom: 1px solid #bdc3c7; padding: 4px;">お客様名</div>
                    <div style="padding: 4px;">人数</div>
                </th>
                <td style="width: 15%; padding: 0;">
                    <div style="border-bottom: 1px solid #bdc3c7; padding: 4px;"><input id="customer" type="text" style="width: 90%;"></div>
                    <div style="padding: 4px; display: flex; align-items: center; justify-content: center;">
                        <input id="people" type="text" style="width: 60%; text-align: right;">
                        <span style="margin-left: 5px;">人</span>
                    </div>
                </td>

                <th style="width: 10%;">連絡先</th>
                <td style="width: 15%;"><input id="contact" type="text" style="width: 90%;"></td>
            </tr>
        </table>

        <table>
            <thead>
                <tr>
                    <th style="width: 20%;">出発場所・時間</th>
                    <th style="width: 25%;">運行の経路・主な経過地</th>
                    <th style="width: 20%;">目的地</th>
                    <th style="width: 20%;">休憩地点・宿泊地点</th>
                    <th style="width: 15%;">休憩・睡眠時間</th>
                </tr>
            </thead>
            <tbody>
                <tr class="route-row"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="route-row"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="route-row"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="route-row"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="route-row"><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>

        <div class="notes-row">
            <table><tr><th>運行に際して注意を要する箇所の位置</th></tr><tr><td></td></tr></table>
            <table><tr><th>その他運行の安全を確保するために必要な事項</th></tr><tr><td></td></tr></table>
        </div>
    </div>
</div>

<script>
    // 作成日：今日の日付を初期値にする（書き換え可）
    (function () {
        const d = new Date();
        const w = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
        const pad = n => String(n).padStart(2, "0");
        document.getElementById("created").value =
            d.getFullYear() + "年" + pad(d.getMonth() + 1) + "月" + pad(d.getDate()) + "日 (" + w + ")";
    })();

    // URLの指定で入力欄を埋める（元の画面と同じ）:
    //   ?customer=…&people=…&contact=…&carName=…&carPlate=…&driver=…
    (function () {
        const q = new URLSearchParams(location.search);
        const set = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
        set("customer", q.get("customer"));
        set("people", (q.get("people") || "").match(/\d+/) ? q.get("people").match(/\d+/)[0] : "");
        set("contact", q.get("contact"));
        set("driver", q.get("driver"));
        const name = q.get("carName") || "", plate = q.get("carPlate") || "";
        if (name || plate) set("car", [name, plate].filter(Boolean).join(" / "));
    })();
</script>
</body>
</html>
